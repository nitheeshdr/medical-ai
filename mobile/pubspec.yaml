name: medinova_ai
description: MediNova AI — Production-ready AI-powered Healthcare SaaS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.5
  firebase_crashlytics: ^4.3.5
  google_sign_in: ^6.2.2

  # State management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Navigation
  go_router: ^17.2.3

  # Networking
  dio: ^5.4.3+1
  web_socket_channel: ^3.0.1

  # Local storage & security
  flutter_secure_storage: ^10.2.0
  shared_preferences: ^2.3.1
  hive_flutter: ^1.1.0

  # Camera & media
  camera: ^0.12.0+1
  image_picker: ^1.1.2
  file_picker: ^11.0.2

  # Notifications
  flutter_local_notifications: ^21.0.0

  # UI & animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^1.2.0
  syncfusion_flutter_charts: ^33.2.6
  percent_indicator: ^4.2.3

  # Utilities
  intl: ^0.20.0
  url_launcher: ^6.3.0
  permission_handler: ^12.0.1
  connectivity_plus: ^7.1.1
  path_provider: ^2.1.4
  open_file: ^3.3.2
  share_plus: ^12.0.2
  uuid: ^4.4.2
  logger: ^2.4.0

  # PDF
  pdf: ^3.11.1
  printing: ^5.13.1

  # Bluetooth / wearables
  flutter_blue_plus: ^2.3.2

  # Speech
  speech_to_text: ^7.3.0
  flutter_tts: ^4.0.2

  cupertino_icons: ^1.0.8

  # Native Liquid Glass (iOS/macOS UIKit Platform Views — requires Xcode 26+)
  cupertino_native: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^4.0.0+1
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
